<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Dashboard</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 2rem; }
      .card { border: 1px solid #e5e7eb; padding: 1rem; border-radius: 8px; max-width: 640px }
      pre { background:#f8fafc; padding:1rem }
    </style>
  </head>
  <body>
    <h1>Admin Dashboard</h1>
    <div class="card">
      <p><strong>Logged in as:</strong> <span id="who">(from token)</span></p>
      <p><strong>User count:</strong> <span id="count">...</span></p>
      <h3>Users</h3>
      <pre id="users">loading…</pre>
    </div>

    <script>
      async function load() {
        try {
          const token = localStorage.getItem('token');
          if (!token) return document.getElementById('users').textContent = 'No token in localStorage. Login first and save token to localStorage as `token`.';
          document.getElementById('who').textContent = 'authenticated';
          const res = await fetch('/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
          if (!res.ok) {
            document.getElementById('users').textContent = 'Error: ' + res.status + ' ' + (await res.text());
            return;
          }
          const data = await res.json();
          document.getElementById('count').textContent = data.userCount;
          document.getElementById('users').textContent = JSON.stringify(data.users, null, 2);
        } catch (err) {
          document.getElementById('users').textContent = String(err);
        }
      }
      load();
    </script>
  </body>
</html>
